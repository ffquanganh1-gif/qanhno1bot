<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QANHNO1 | Thuê Bot Telegram 𝙌𝘼𝙉𝙃𝙑𝙉𝘽𝙊𝙏𝙑𝙄𝙋🇻🇳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container chính */
        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 20px 0;
        }

        /* Header nhỏ phía trên */
        .top-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .shop-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0088cc;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .bot-name {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #00b4d8, #0077b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .divider-line {
            width: 80px;
            height: 3px;
            background: #0088cc;
            margin: 12px auto;
            border-radius: 10px;
        }

        /* 2 Khung lớn */
        .cards-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 280px;
            background: #0a0a0a;
            border: 3px solid #0088cc;
            border-radius: 28px;
            padding: 50px 30px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.15), inset 0 0 30px rgba(0, 136, 204, 0.03);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .card:hover {
            border-color: #00a8e8;
            box-shadow: 0 0 50px rgba(0, 136, 204, 0.3), inset 0 0 40px rgba(0, 136, 204, 0.05);
            transform: translateY(-4px);
        }

        .card-icon {
            font-size: 3.5rem;
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .card-subtitle {
            font-size: 1rem;
            color: #9ba1ad;
            position: relative;
            z-index: 1;
            margin-top: -10px;
        }

        /* Nút MUA Ở ĐÂY */
        .buy-btn {
            display: inline-block;
            background: #0088cc;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            border: 2px solid #0088cc;
            box-shadow: 0 8px 30px rgba(0, 136, 204, 0.4);
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #00a1e4;
            border-color: #00a1e4;
            box-shadow: 0 12px 40px rgba(0, 136, 204, 0.6);
            transform: scale(1.05);
        }

        .buy-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.5);
        }

        /* Footer */
        .footer-note {
            text-align: center;
            color: #555;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .footer-note a {
            color: #0088cc;
            text-decoration: none;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 650px) {
            .cards-wrapper {
                flex-direction: column;
                gap: 24px;
            }
            .card {
                padding: 40px 20px 32px;
            }
            .card-title {
                font-size: 2.2rem;
            }
            .buy-btn {
                font-size: 1.3rem;
                padding: 16px 40px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- Header -->
        <div class="top-header">
            <div class="shop-name">QANHNO1</div>
            <div class="bot-name">𝙌𝘼𝙉𝙃𝙑𝙉𝘽𝙊𝙏𝙑𝙄𝙋🇻🇳</div>
            <div class="divider-line"></div>
        </div>

        <!-- 2 Khung lớn -->
        <div class="cards-wrapper">

            <!-- Khung 1: Mua Tháng -->
            <div class="card">
                <div class="card-icon">📅</div>
                <div class="card-title">Mua Tháng</div>
                <div class="card-subtitle">Thuê bot theo tháng · Gia hạn linh hoạt</div>
                <a href="https://t.me/QanhCheater" target="_blank" class="buy-btn">MUA Ở ĐÂY</a>
            </div>

            <!-- Khung 2: Mua Vĩnh Viễn -->
            <div class="card">
                <div class="card-icon">♾️</div>
                <div class="card-title">Mua Vĩnh Viễn</div>
                <div class="card-subtitle">Sở hữu trọn đời · Không giới hạn</div>
                <a href="https://t.me/QanhCheater" target="_blank" class="buy-btn">MUA Ở ĐÂY</a>
            </div>

        </div>

        <!-- Footer -->
        <div class="footer-note">
            Liên hệ Telegram: <a href="https://t.me/QanhCheater" target="_blank">@QanhCheater</a>
        </div>

    </div>

</body>
</html>
