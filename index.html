<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QANHNO1 | Thuê Bot Telegram 𝙌𝘼𝙉𝙃𝙑𝙉𝘽𝙊𝙏𝙑𝙄𝙋🇻🇳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ============ BACKGROUND SỐNG ĐỘNG ============ */

        /* Lớp nền sao lấp lánh */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.8); box-shadow: 0 0 15px #0088cc, 0 0 30px #0088cc; }
        }

        /* Hạt particles trôi nổi */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: #0088cc;
            border-radius: 50%;
            animation: floatUp var(--duration) linear infinite;
            animation-delay: var(--delay);
            opacity: 0;
            box-shadow: 0 0 10px #0088cc, 0 0 20px #0088cc;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) translateX(var(--drift)) scale(1.2);
                opacity: 0;
            }
        }

        /* Vòng tròn ánh sáng di chuyển */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat var(--duration) ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 136, 204, 0.12);
            top: -100px;
            left: -100px;
            --duration: 12s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: rgba(0, 180, 216, 0.1);
            bottom: -120px;
            right: -80px;
            --duration: 15s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(0, 119, 182, 0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            --duration: 18s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(30px, 10px) scale(1.05); }
        }

        /* Grid line chuyển động */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 136, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 136, 204, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* Ring ánh sáng xoay */
        .ring-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            pointer-events: none;
            z-index: 0;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(0, 136, 204, 0.08);
            animation: ringRotate var(--duration) linear infinite;
        }

        .ring-1 {
            width: 300px;
            height: 300px;
            margin-top: -150px;
            margin-left: -150px;
            --duration: 30s;
        }

        .ring-2 {
            width: 450px;
            height: 450px;
            margin-top: -225px;
            margin-left: -225px;
            --duration: 40s;
            animation-direction: reverse;
        }

        .ring-3 {
            width: 600px;
            height: 600px;
            margin-top: -300px;
            margin-left: -300px;
            --duration: 50s;
        }

        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============ NỘI DUNG CHÍNH ============ */

        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 20px 0;
            position: relative;
            z-index: 1;
        }

        .top-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .shop-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0088cc;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(0, 136, 204, 0.5);
            animation: glowText 3s ease-in-out infinite;
        }

        @keyframes glowText {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 136, 204, 0.5); }
            50% { text-shadow: 0 0 40px rgba(0, 136, 204, 0.9), 0 0 60px rgba(0, 136, 204, 0.5); }
        }

        .bot-name {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #00b4d8, #0077b6, #00b4d8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        .divider-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0088cc, transparent);
            margin: 12px auto;
            border-radius: 10px;
        }

        .cards-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 280px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 3px solid #0088cc;
            border-radius: 28px;
            padding: 50px 30px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            transition: all 0.4s ease;
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.15), inset 0 0 30px rgba(0, 136, 204, 0.03);
            position: relative;
            overflow: hidden;
        }

        /* Hiệu ứng viền sáng quét quanh card */
        .card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 30px;
            background: linear-gradient(60deg, #0088cc, #00b4d8, #0077b6, #0088cc);
            background-size: 300% 300%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: borderGlow 3s ease infinite;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .card:hover::after {
            opacity: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.06) 0%, transparent 70%);
            pointer-events: none;
            animation: orbFloat 8s ease-in-out infinite;
        }

        .card:hover {
            border-color: #00a8e8;
            box-shadow: 0 0 60px rgba(0, 136, 204, 0.35), inset 0 0 50px rgba(0, 136, 204, 0.06);
            transform: translateY(-8px);
        }

        .card-icon {
            font-size: 3.5rem;
            position: relative;
            z-index: 1;
            animation: iconBounce 2s ease-in-out infinite;
        }

        .card:nth-child(2) .card-icon {
            animation-delay: 0.5s;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .card-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .card-subtitle {
            font-size: 1rem;
            color: #9ba1ad;
            position: relative;
            z-index: 1;
            margin-top: -10px;
        }

        /* Nút MUA Ở ĐÂY với hiệu ứng pulse */
        .buy-btn {
            display: inline-block;
            background: linear-gradient(135deg, #0088cc, #00a1e4);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            border: none;
            box-shadow: 0 8px 30px rgba(0, 136, 204, 0.4);
            cursor: pointer;
            animation: pulseBtn 2.5s ease-in-out infinite;
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 8px 30px rgba(0, 136, 204, 0.4); }
            50% { box-shadow: 0 12px 50px rgba(0, 136, 204, 0.7), 0 0 80px rgba(0, 136, 204, 0.3); }
        }

        .buy-btn:hover {
            background: linear-gradient(135deg, #00a1e4, #00b4d8);
            box-shadow: 0 15px 50px rgba(0, 136, 204, 0.7), 0 0 100px rgba(0, 136, 204, 0.4);
            transform: scale(1.08);
            animation: none;
        }

        .buy-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.5);
        }

        .footer-note {
            text-align: center;
            color: #555;
            font-size: 0.85rem;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .footer-note a {
            color: #0088cc;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 650px) {
            .cards-wrapper {
                flex-direction: column;
                gap: 24px;
            }
            .card {
                padding: 40px 20px 32px;
            }
            .card-title {
                font-size: 2.2rem;
            }
            .buy-btn {
                font-size: 1.3rem;
                padding: 16px 40px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND SỐNG ĐỘNG ===== -->

    <!-- Vòng tròn ánh sáng -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Grid line -->
    <div class="grid-overlay"></div>

    <!-- Vòng ring xoay -->
    <div class="ring-container">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
    </div>

    <!-- Sao lấp lánh -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Particles trôi nổi -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- ===== NỘI DUNG CHÍNH ===== -->
    <div class="main-container">
        <div class="top-header">
            <div class="shop-name">QANHNO1</div>
            <div class="bot-name">𝙌𝘼𝙉𝙃𝙑𝙉𝘽𝙊𝙏𝙑𝙄𝙋🇻🇳</div>
            <div class="divider-line"></div>
        </div>

        <div class="cards-wrapper">
            <div class="card">
                <div class="card-icon">📅</div>
                <div class="card-title">Mua Tháng</div>
                <div class="card-subtitle">Thuê bot theo tháng · Gia hạn linh hoạt</div>
                <a href="https://t.me/QanhCheater" target="_blank" class="buy-btn">MUA Ở ĐÂY</a>
            </div>

            <div class="card">
                <div class="card-icon">♾️</div>
                <div class="card-title">Mua Vĩnh Viễn</div>
                <div class="card-subtitle">Sở hữu trọn đời · Không giới hạn</div>
                <a href="https://t.me/QanhCheater" target="_blank" class="buy-btn">MUA Ở ĐÂY</a>
            </div>
        </div>

        <div class="footer-note">
            Liên hệ Telegram: <a href="https://t.me/QanhCheater" target="_blank">@QanhCheater</a>
        </div>
    </div>

    <!-- ===== JAVASCRIPT TẠO BACKGROUND ĐỘNG ===== -->
    <script>
        // Tạo sao lấp lánh
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starCount = 120;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 3 + 1;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;
                
                star.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    top: ${posY}%;
                    left: ${posX}%;
                    --duration: ${duration}s;
                    --delay: ${delay}s;
                `;
                
                container.appendChild(star);
            }
        }

        // Tạo particles trôi nổi
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            const particleCount = 35;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 4 + 2;
                const posX = Math.random() * 100;
                const duration = Math.random() * 10 + 8;
                const delay = Math.random() * 10;
                const drift = (Math.random() - 0.5) * 150;
                
                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${posX}%;
                    --duration: ${duration}s;
                    --delay: ${delay}s;
                    --drift: ${drift}px;
                `;
                
                container.appendChild(particle);
            }
        }

        // Khởi chạy
        createStars();
        createParticles();
    </script>
</body>
</html>
